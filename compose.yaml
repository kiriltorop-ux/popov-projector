services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE: /data/popov.sqlite3
      # Only Caddy exposes a host port and supplies the real remote client address.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - popov-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  popov-data:
  caddy-data:
  caddy-config:
